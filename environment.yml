# Conda environment for reproducing the main results.
# Mirrors requirements.txt (the canonical pin file).
#
#   conda env create -f environment.yml
#   conda activate nn-universe
#   bash run_all.sh
name: nn-universe
channels:
  - conda-forge
dependencies:
  - python>=3.11,<3.13
  - pip
  - pip:
      - numpy>=1.26,<2.3
      - scipy>=1.11,<1.16
      - torch>=2.1,<2.7
      - transformers>=4.40,<4.50
      - datasets>=2.14,<3.5
      - torchvision>=0.18,<0.22
      - huggingface_hub>=0.20,<0.30
      - safetensors>=0.4,<0.6
      - matplotlib>=3.8
      - pytest>=8.0
